{% extends "base.html" %}

{% block title %}Add Expense — Spendly{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="auth-container">
        <div class="auth-header">
            <h1 class="auth-title">Add Expense</h1>
            <p class="auth-subtitle">Record a new transaction to track your spending</p>
        </div>

        <div class="auth-card">
            {% if error %}
            <div class="auth-error">
                <i data-lucide="alert-circle" class="alert-icon"></i>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form method="POST" action="{{ url_for('add_expense') }}" class="expense-form">
                <div class="form-group">
                    <label for="amount">Amount (₹)</label>
                    <div class="input-with-prefix">
                        <span class="currency-prefix">₹</span>
                        <input type="number" id="amount" name="amount" step="0.01" min="0.01"
                               value="{{ amount or '' }}" placeholder="0.00" class="form-input" required autofocus>
                    </div>
                </div>

                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" name="category" class="form-input form-select" required>
                        <option value="" disabled {% if not category %}selected{% endif %}>Select a category</option>
                        {% for cat in categories %}
                        <option value="{{ cat }}" {% if category == cat %}selected{% endif %}>{{ cat }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" name="date" value="{{ date or '' }}" class="form-input" required>
                </div>

                <div class="form-group">
                    <label for="description">Description <span class="label-hint">(optional)</span></label>
                    <input type="text" id="description" name="description" maxlength="200"
                           value="{{ description or '' }}" placeholder="e.g. Grocery run or coffee" class="form-input">
                </div>

                <div class="form-actions-row">
                    <button type="submit" class="btn-primary btn-save-expense">Save Expense</button>
                    <a href="{{ url_for('profile') }}" class="btn-ghost">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</section>
{% endblock %}
